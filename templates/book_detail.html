<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book.title }} - Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .custom-card {
            background: #ffffff;
            border-left: 5px solid #0d6efd; /* বামপাশে নীল বর্ডার */
            border-radius: 10px;
        }
    </style>
</head>
<body class="p-5">
    <div class="container col-md-6">
        <div class="card custom-card shadow-sm p-4">
            <h2 class="text-primary">{{ book.title }}</h2>
            <hr>
            <p><strong>Author:</strong> {{ book.author }}</p>
            <p><strong>Category:</strong> <span class="badge bg-info">{{ book.category }}</span></p>
            <p><strong>Publish Date:</strong> {{ book.publish_date }}</p>
            <p><strong>Description:</strong> {{ book.description }}</p>
            
            <div>
                <a href="{% url 'book_list' %}" class="btn btn-outline-secondary mt-3">Back to List</a>
            </div>
        </div>
    </div>
</body>
</html>
